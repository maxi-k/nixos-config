# More option see https://github.com/DreamMaoMao/mango/wiki/
source=./monitors.conf
exec-once=~/.config/mango/autostart.sh

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=100
animation_duration_open=50
animation_duration_tag=100
animation_duration_close=100
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=1
scratchpad_cross_monitor=1
exchange_cross_monitor=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=32
cursor_hide_timeout=30
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us,de
bindl=SUPER+SHIFT,space,switch_keyboard_layout


# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=0
gappiv=0
gappoh=0
gappov=0
scratchpad_width_ratio=0.7
scratchpad_height_ratio=0.7
borderpx=4
rootcolor=0x222222ff
bordercolor=0x30302fff
focuscolor=0x7f7f7fff
maximizescreencolor=0x89aa61ff
urgentcolor=0xff0000ff
scratchpadcolor=0x7f7f7fff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=SUPER,Return,spawn,alacritty
bind=SUPER,p,spawn,launcher
bind=SUPER+SHIFT,b,spawn,alacritty -e 'bluetoothctl'
bind=SUPER+SHIFT,c,spawn,alacritty -e 'numbat'
bind=SUPER+SHIFT,e,spawn,libreoffice --calc

# switch layout
bind=SUPER,n,switch_layout
bind=SUPER,y,setlayout,tile
bind=SUPER,t,setlayout,deck
bind=SUPER+SHIFT,p,spawn,mango-select-layout

# exit
bind=SUPER+SHIFT,Delete,quit
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
# previous window
bind=SUPER,o,focuslast
# focus next in stack
bind=SUPER+SHIFT,o,focusstack,next
bind=ALT,Tab,focusstack,next

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
# exchange with master
bind=SUPER,space,zoom


# swap window
bind=SUPER+CTRL,k,move_client,up
bind=SUPER+CTRL,j,move_client,down
bind=SUPER+CTRL,h,move_client,left
bind=SUPER+CTRL,l,move_client,right

# switch window status
bind=SUPER+SHIFT,g,toggleglobal,
bind=SUPER,Tab,toggleoverview,
bind=SUPER,g,togglefloating,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
# bind=SUPER,o,toggleoverlay,

bind=SUPER,i,incnmaster,+1
bind=SUPER+Shift,i,incnmaster,-1
bind=SUPER,equal,setmfact,+0.05
bind=SUPER,minus,setmfact,-0.05

# global scratchpad (comma)
bind=SUPER+SHIFT,comma,minimized
bind=SUPER+ALT,comma,restore_minimized
bind=SUPER,comma,toggle_scratchpad

# special emacs scratchpad (period) 
windowrule=isnamedscratchpad:1,width:1200,height:800,title:emacs-scratchpad
bind=SUPER,period,toggle_named_scratchpad,none,emacs-scratch,emacs-scratchpad


# scroller layout
bind=SUPER,e,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0
# previous tag
bind=SUPER,bracketleft,view,-1,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tagsilent,1,0
bind=SUPER+SHIFT,2,tagsilent,2,0
bind=SUPER+SHIFT,3,tagsilent,3,0
bind=SUPER+SHIFT,4,tagsilent,4,0
bind=SUPER+SHIFT,5,tagsilent,5,0
bind=SUPER+SHIFT,6,tagsilent,6,0
bind=SUPER+SHIFT,7,tagsilent,7,0
bind=SUPER+SHIFT,8,tagsilent,8,0
bind=SUPER+SHIFT,9,tagsilent,9,0
bind=SUPER+SHIFT,0,tagsilent,10,0


bind=SUPER+ALT,1,comboview,1
bind=SUPER+ALT,2,comboview,2
bind=SUPER+ALT,3,comboview,3
bind=SUPER+ALT,4,comboview,4
bind=SUPER+ALT,5,comboview,5
bind=SUPER+ALT,6,comboview,6
bind=SUPER+ALT,7,comboview,7
bind=SUPER+ALT,8,comboview,8
bind=SUPER+ALT,9,comboview,9
bind=SUPER+ALT,10,comboview,10

bind=SUPER+CTRL,1,toggletag,1
bind=SUPER+CTRL,2,toggletag,2
bind=SUPER+CTRL,3,toggletag,3
bind=SUPER+CTRL,4,toggletag,4
bind=SUPER+CTRL,5,toggletag,5
bind=SUPER+CTRL,6,toggletag,6
bind=SUPER+CTRL,7,toggletag,7
bind=SUPER+CTRL,8,toggletag,8
bind=SUPER+CTRL,9,toggletag,9
bind=SUPER+CTRL,0,toggletag,10

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
# bind=SUPER+SHIFT,X,incgaps,1
# bind=SUPER+SHIFT,Z,incgaps,-1
# bind=SUPER+SHIFT,R,togglegaps

# movewin
# bind=CTRL+SHIFT,Up,movewin,+0,-50
# bind=CTRL+SHIFT,Down,movewin,+0,+50
# bind=CTRL+SHIFT,Left,movewin,-50,+0
# bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+SHIFT,Up,resizewin,+0,-50
bind=SUPER+SHIFT,Down,resizewin,+0,+50
bind=SUPER+SHIFT,Left,resizewin,-50,+0
bind=SUPER+SHIFT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
# trackpads sometimes don't quite get the right button right
mousebind=SUPER+SHIFT,btn_left,moveresize,curresize

# 4-finger: Workspace navigation
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview


# Axis Bindings (mouse wheel)
# axisbind=SUPER,UP,viewtoleft_have_client
# axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
